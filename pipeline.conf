input {
  file {
    id => "linux_log_files"
    path => ["/logs/*.log"]
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "read"
    exit_after_read => true
    codec => plain {
      charset => "UTF-8"
    }
  }
}

filter {
  mutate {
    add_field => {
      "event_source" => "linux"
      "log_category" => "system"
    }
  }

  if [message] =~ /(?i)(sshd|ssh login|secure shell)/ {
    mutate {
      replace => {
        "log_category" => "ssh"
      }
    }
  } else if [message] =~ /(?i)(authentication failure|failed password|accepted password|accepted publickey|pam_unix|sudo:|session opened|session closed)/ {
    mutate {
      replace => {
        "log_category" => "authentication"
      }
    }
  }

  grok {
    match => {
      "message" => [
        "%{SYSLOGTIMESTAMP:syslog_timestamp} %{HOSTNAME:hostname} %{DATA:process}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:log_message}",
        "%{TIMESTAMP_ISO8601:syslog_timestamp} %{HOSTNAME:hostname} %{DATA:process}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:log_message}"
      ]
    }
    tag_on_failure => ["_grokparsefailure"]
  }

  if [message] =~ /(?i)(sshd|ssh login|secure shell)/ {
    mutate {
      replace => {
        "log_category" => "ssh"
      }
    }
  }

  if [message] =~ /(?i)(authentication failure|failed password|accepted password|accepted publickey|pam_unix|sudo:|session opened|session closed)/ {
    mutate {
      replace => {
        "log_category" => "authentication"
      }
    }
  }

  mutate {
    add_field => {
      "[@metadata][target_index]" => "linux-logs"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
  }

  stdout {
    codec => rubydebug
  }
}
